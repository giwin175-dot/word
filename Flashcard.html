<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSRS 智慧英語單字閃卡</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text: #1F2937;
            --success: #10B981;
            --danger: #EF4444;
            --secondary: #6B7280;
            --secondary-hover: #4B5563;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
        }

        h1 {
            margin: 0 0 10px 0;
            color: var(--primary);
            font-size: 1.8rem;
        }

        .panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        label {
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 4px;
            display: block;
        }

        select, input[type="file"], button, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #D1D5DB;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.9rem;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button.btn-danger {
            background-color: var(--danger);
        }

        button.btn-success {
            background-color: var(--success);
        }

        button.btn-secondary {
            background-color: var(--secondary);
        }

        button.btn-secondary:hover {
            background-color: var(--secondary-hover);
        }

        /* 閃卡頂部工具列 */
        .card-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .progress-bar {
            font-size: 0.85rem;
            color: #6B7280;
            font-weight: bold;
        }

        .shuffle-btn {
            width: auto;
            padding: 4px 10px;
            font-size: 0.8rem;
            background-color: #E5E7EB;
            color: #374151;
            border-radius: 4px;
        }

        .shuffle-btn:hover {
            background-color: #D1D5DB;
        }

        /* 閃卡區域 */
        .card-container {
            position: relative;
            width: 100%;
            height: 320px;
            perspective: 1000px;
        }

        .card {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background: var(--card-bg);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            user-select: none;
            border: 2px solid #E5E7EB;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        .card-text {
            font-size: 2.2rem;
            font-weight: bold;
            text-align: center;
            word-break: break-word;
        }

        /* 可點擊發音區域 */
        .tts-zone {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            cursor: pointer;
        }

        .tts-zone:hover {
            background-color: rgba(79, 70, 229, 0.05);
        }

        .tts-icon {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.2rem;
            opacity: 0.5;
            pointer-events: none;
        }

        /* 操作按鈕網格 */
        .action-btns-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .main-action-btns {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .main-action-btns button, .action-btns-grid > button {
            padding: 12px 8px;
            font-size: 0.95rem;
            border-radius: 8px;
        }

        /* 結算畫面 */
        .complete-panel {
            text-align: center;
            padding: 30px 20px;
        }

        .complete-panel h2 {
            color: var(--primary);
            margin-top: 0;
        }

        .summary-box {
            background: #F9FAFB;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            border: 1px solid #E5E7EB;
            text-align: left;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .summary-item:last-child {
            margin-bottom: 0;
        }

        /* 單字清單預覽與管理 */
        .deck-list {
            max-height: 150px;
            overflow-y: auto;
            margin-top: 10px;
            border: 1px solid #E5E7EB;
            border-radius: 6px;
        }

        .deck-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid #E5E7EB;
        }

        .deck-item:last-child {
            border-bottom: none;
        }

        .empty-state {
            text-align: center;
            padding: 15px;
            color: #9CA3AF;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>FSRS 智慧單字卡</h1>
        <p style="margin-top: 12px;">
            <a href="index.html" style="display: inline-block; padding: 6px 16px; background-color: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; border-radius: 20px; font-weight: 600; text-decoration: none; font-size: 0.9rem;">
                ⬅️ 返回單字學習表
            </a>
        </p>
    </header>

    <!-- 設定面板 -->
    <div class="panel">
        <div class="controls">
            <div>
                <label for="directionSelect">翻卡方向</label>
                <select id="directionSelect">
                    <option value="en2zh">英文 ➔ 中文</option>
                    <option value="zh2en">中文 ➔ 英文</option>
                </select>
            </div>
            <div>
                <label for="voiceSelect">TTS 語音發音</label>
                <select id="voiceSelect">
                    <option value="">載入中...</option>
                </select>
            </div>
        </div>

        <div>
            <label>匯入單字表 (格式: 英文,中文 每行一個)</label>
            <input type="file" id="fileInput" accept=".txt,.csv" />
        </div>
    </div>

    <!-- 閃卡主區域 -->
    <div id="flashcardArea" style="display:none;">
        <div class="card-header-bar">
            <button class="shuffle-btn" onclick="shuffleQueue()">🔀 打亂單字</button>
            <div class="progress-bar" id="progressBar">1 / 10</div>
        </div>

        <div class="card-container">
            <div class="card" id="card" onclick="toggleFlip(event)">
                <!-- 正面 -->
                <div class="card-face card-front">
                    <span class="tts-icon">🔊 點擊發音</span>
                    <div class="tts-zone" onclick="speakCurrent(event)"></div>
                    <div class="card-text" id="frontText"></div>
                </div>
                <!-- 背面 -->
                <div class="card-face card-back">
                    <span class="tts-icon">🔊 點擊發音</span>
                    <div class="tts-zone" onclick="speakCurrent(event)"></div>
                    <div class="card-text" id="backText"></div>
                </div>
            </div>
        </div>

        <div class="action-btns-grid">
            <div class="main-action-btns">
                <button onclick="handleResponse('again')" style="background-color: var(--danger)">忘記 (Again)</button>
                <button onclick="toggleFlip()" style="background-color: var(--primary)">翻轉卡片</button>
                <button onclick="handleResponse('good')" style="background-color: var(--success)">記得 (Good)</button>
            </div>
            <button class="btn-secondary" id="btnPrevCard" onclick="prevCard()">⬅️ 返回上一張卡片</button>
        </div>
    </div>

    <!-- 測驗完成結算面板 -->
    <div id="completeArea" class="panel complete-panel" style="display:none;">
        <h2>🎉 本輪測驗已完成！</h2>
        <div class="summary-box">
            <div class="summary-item">
                <span>單字總數：</span>
                <strong id="summaryTotal">0</strong>
            </div>
            <div class="summary-item">
                <span>目前需要複習（已到期）：</span>
                <strong id="summaryDue" style="color: var(--danger);">0</strong>
            </div>
            <div class="summary-item">
                <span>記憶狀況良好（尚未到期）：</span>
                <strong id="summaryLearning" style="color: var(--success);">0</strong>
            </div>
        </div>
        
        <p id="fsrsRecommendation" style="margin: 15px 0; font-size: 0.95rem; color: #4B5563;"></p>

        <div style="display: flex; flex-direction: column; gap: 10px;">
            <button id="btnStartDueReview" class="btn-success" onclick="startTest(true)">開啟下一輪測驗 (複習到期單字)</button>
            <button class="btn-primary" onclick="startTest(false)">強制重新練習全體單字</button>
        </div>
    </div>

    <!-- 單字庫管理面板 -->
    <div class="panel">
        <h3>目前單字庫 (<span id="cardCount">0</span>)</h3>
        <div class="deck-list" id="deckList">
            <div class="empty-state">目前沒有單字，請上傳檔案。</div>
        </div>
        <button class="btn-danger" style="margin-top: 10px;" onclick="clearDeck()">刪除全部單字庫</button>
    </div>
</div>

<script>
    // ==========================================
    // 1. FSRS 演算法核心邏輯
    // ==========================================
    class FSRS {
        constructor() {
            this.w = [0.4, 0.6, 2.4, 5.8, 4.93, 0.94, 0.86, 0.01, 1.49, 0.14, 0.94, 2.18, 0.05, 0.34, 1.26, 0.29, 2.61];
        }

        initCard() {
            return {
                stability: 0,
                difficulty: 0,
                elapsed_days: 0,
                scheduled_days: 0,
                repetition: 0,
                state: 'New',
                last_review: null
            };
        }

        next(card, rating) {
            let s = card.stability;
            let d = card.difficulty;
            const now = new Date().toISOString();

            if (card.state === 'New') {
                d = Math.max(1, Math.min(10, 8.25 - (rating - 3) * 1.5));
                s = rating === 1 ? this.w[0] : this.w[2];
                return {
                    ...card,
                    stability: s,
                    difficulty: d,
                    repetition: 1,
                    state: 'Learning',
                    last_review: now,
                    scheduled_days: Math.round(s)
                };
            }

            const next_d = Math.max(1, Math.min(10, d - 0.8 * (rating - 3)));
            
            let next_s = s;
            if (rating === 1) { // 忘記
                next_s = Math.max(0.1, this.w[11] * Math.pow(next_d, -this.w[12]) * (Math.pow(s + 1, this.w[13]) - 1));
            } else { // 記得
                next_s = s * (1 + Math.exp(this.w[8]) * (11 - next_d) * Math.pow(s, -this.w[9]));
            }

            return {
                ...card,
                stability: parseFloat(next_s.toFixed(2)),
                difficulty: parseFloat(next_d.toFixed(2)),
                repetition: card.repetition + 1,
                state: 'Review',
                last_review: now,
                scheduled_days: Math.max(1, Math.round(next_s))
            };
        }

        isDue(card) {
            if (card.state === 'New' || !card.last_review) return true;
            
            const lastReviewDate = new Date(card.last_review);
            const nextDueDate = new Date(lastReviewDate);
            nextDueDate.setDate(nextDueDate.getDate() + card.scheduled_days);
            
            return new Date() >= nextDueDate;
        }
    }

    const fsrs = new FSRS();

    // ==========================================
    // 2. 資料管理 (LocalStorage)
    // ==========================================
    let deck = JSON.parse(localStorage.getItem('fsrs_deck')) || [];
    let currentQueue = [];
    let queueIndex = 0;
    let isFlipped = false;

    function saveDeck() {
        localStorage.setItem('fsrs_deck', JSON.stringify(deck));
        renderDeckList();
    }

    // ==========================================
    // 3. TTS 語音功能
    // ==========================================
    const synth = window.speechSynthesis;
    const voiceSelect = document.getElementById('voiceSelect');
    let voices = [];

    function populateVoiceList() {
        voices = synth.getVoices().filter(v => v.lang.includes('en'));
        voiceSelect.innerHTML = '';
        
        const usVoices = voices.filter(v => v.lang.includes('US') || v.lang.includes('en-US'));
        const ukVoices = voices.filter(v => v.lang.includes('GB') || v.lang.includes('en-GB'));
        const otherVoices = voices.filter(v => !usVoices.includes(v) && !ukVoices.includes(v));

        const addGroup = (label, list) => {
            if (list.length === 0) return;
            const group = document.createElement('optgroup');
            group.label = label;
            list.forEach(voice => {
                const option = document.createElement('option');
                option.textContent = `${voice.name} (${voice.lang})`;
                option.value = voice.name;
                group.appendChild(option);
            });
            voiceSelect.appendChild(group);
        };

        addGroup('美式英語 (US)', usVoices);
        addGroup('英式英語 (UK)', ukVoices);
        addGroup('其他英語', otherVoices);
    }

    populateVoiceList();
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = populateVoiceList;
    }

    function speakText(text) {
        if (!text) return;
        if (synth.speaking) synth.cancel();
        const utterThis = new SpeechSynthesisUtterance(text);
        const selectedOption = voiceSelect.value;
        const selectedVoice = voices.find(v => v.name === selectedOption);
        if (selectedVoice) {
            utterThis.voice = selectedVoice;
        }
        synth.speak(utterThis);
    }

    function speakCurrent(event) {
        if (event) event.stopPropagation();
        const currentCard = currentQueue[queueIndex];
        if (!currentCard) return;

        const direction = document.getElementById('directionSelect').value;
        let textToRead = "";

        if (!isFlipped) {
            textToRead = direction === 'en2zh' ? currentCard.en : currentCard.zh;
        } else {
            textToRead = direction === 'en2zh' ? currentCard.zh : currentCard.en;
        }

        if (/[a-zA-Z]/.test(textToRead)) {
            speakText(textToRead);
        }
    }

    // ==========================================
    // 4. 測驗佇列與流程控制
    // ==========================================
    const cardElem = document.getElementById('card');
    const frontTextElem = document.getElementById('frontText');
    const backTextElem = document.getElementById('backText');

    function startTest(onlyDue = true) {
        if (deck.length === 0) {
            document.getElementById('flashcardArea').style.display = 'none';
            document.getElementById('completeArea').style.display = 'none';
            return;
        }

        if (onlyDue) {
            currentQueue = deck.filter(card => fsrs.isDue(card.fsrs));
            if (currentQueue.length === 0) {
                currentQueue = [...deck].sort((a, b) => a.fsrs.stability - b.fsrs.stability);
            }
        } else {
            currentQueue = [...deck];
        }

        queueIndex = 0;
        document.getElementById('completeArea').style.display = 'none';
        document.getElementById('flashcardArea').style.display = 'block';
        renderCard();
    }

    function renderCard() {
        if (queueIndex >= currentQueue.length) {
            showCompleteScreen();
            return;
        }

        const item = currentQueue[queueIndex];
        const direction = document.getElementById('directionSelect').value;

        if (direction === 'en2zh') {
            frontTextElem.innerText = item.en;
            backTextElem.innerText = item.zh;
        } else {
            frontTextElem.innerText = item.zh;
            backTextElem.innerText = item.en;
        }

        document.getElementById('progressBar').innerText = `${queueIndex + 1} / ${currentQueue.length}`;
        
        // 控制「上一張」按鈕的啟用狀態
        document.getElementById('btnPrevCard').disabled = (queueIndex === 0);
        document.getElementById('btnPrevCard').style.opacity = (queueIndex === 0) ? '0.5' : '1';

        isFlipped = false;
        cardElem.classList.remove('flipped');
    }

    function toggleFlip(event) {
        if (event && event.target.classList.contains('tts-zone')) return;
        isFlipped = !isFlipped;
        cardElem.classList.toggle('flipped', isFlipped);
    }

    document.getElementById('directionSelect').addEventListener('change', renderCard);

    // 評分與 FSRS 演算 (Again=1, Good=3)
    function handleResponse(type) {
        if (currentQueue.length === 0) return;

        const rating = type === 'again' ? 1 : 3;
        const currentCard = currentQueue[queueIndex];
        
        const targetCard = deck.find(c => c.id === currentCard.id);
        if (targetCard) {
            targetCard.fsrs = fsrs.next(targetCard.fsrs, rating);
            saveDeck();
        }

        queueIndex++;
        renderCard();
    }

    // 返回上一張卡片
    function prevCard() {
        if (queueIndex > 0) {
            queueIndex--;
            renderCard();
        }
    }

    // 打亂單字佇列 (Shuffle)
    function shuffleQueue() {
        if (currentQueue.length <= 1) return;
        
        // 將當前位置後面的剩餘卡片隨機打亂
        const remaining = currentQueue.slice(queueIndex);
        for (let i = remaining.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [remaining[i], remaining[j]] = [remaining[j], remaining[i]];
        }
        
        currentQueue = currentQueue.slice(0, queueIndex).concat(remaining);
        renderCard();
    }

    function showCompleteScreen() {
        document.getElementById('flashcardArea').style.display = 'none';
        const completeArea = document.getElementById('completeArea');
        completeArea.style.display = 'block';

        const dueCards = deck.filter(c => fsrs.isDue(c.fsrs));
        const learningCardsCount = deck.length - dueCards.length;

        document.getElementById('summaryTotal').innerText = deck.length;
        document.getElementById('summaryDue').innerText = dueCards.length;
        document.getElementById('summaryLearning').innerText = learningCardsCount;

        const btnStartDue = document.getElementById('btnStartDueReview');
        const recommendationText = document.getElementById('fsrsRecommendation');

        if (dueCards.length > 0) {
            btnStartDue.style.display = 'block';
            btnStartDue.innerText = `開始複習到期的 ${dueCards.length} 個單字`;
            recommendationText.innerHTML = `💡 <b>FSRS 演算法建議：</b>有 <b>${dueCards.length}</b> 個單字記憶強度已低於臨界點，建議立即進行複習！`;
        } else {
            btnStartDue.style.display = 'none';
            recommendationText.innerHTML = `🎉 <b>太棒了！</b> 目前所有單字都在最佳記憶狀態中，無需立即複習！`;
        }
    }

    // ==========================================
    // 5. 檔案上傳與單字庫管理（修正解析切分邏輯）
    // ==========================================
    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const content = e.target.result;
            const lines = content.split('\n');
            let newCards = 0;

            lines.forEach(line => {
                if (!line.trim()) return;

                // 僅對第一個逗號、全形逗號或 Tab 進行切割
                const match = line.match(/[,，\t]/);
                if (match) {
                    const splitIndex = match.index;
                    const en = line.substring(0, splitIndex).trim();
                    const zh = line.substring(splitIndex + 1).trim();

                    if (en && zh) {
                        deck.push({
                            id: Date.now() + Math.random(),
                            en: en,
                            zh: zh,
                            fsrs: fsrs.initCard()
                        });
                        newCards++;
                    }
                }
            });

            if (newCards > 0) {
                saveDeck();
                startTest(true);
                alert(`成功匯入 ${newCards} 個單字！`);
            } else {
                alert('解析失敗，請確認檔案格式為每行「英文,中文」');
            }
        };
        reader.readAsText(file);
    });

    function renderDeckList() {
        const deckListElem = document.getElementById('deckList');
        document.getElementById('cardCount').innerText = deck.length;

        if (deck.length === 0) {
            deckListElem.innerHTML = '<div class="empty-state">目前沒有單字，請上傳檔案。</div>';
            return;
        }

        deckListElem.innerHTML = '';
        deck.forEach((item, idx) => {
            const isDue = fsrs.isDue(item.fsrs);
            const statusTag = isDue ? '<span style="color:var(--danger); font-size:0.8rem; margin-left:8px;">[待複習]</span>' : '';
            
            const div = document.createElement('div');
            div.className = 'deck-item';
            div.innerHTML = `
                <span><strong>${item.en}</strong> - ${item.zh} ${statusTag}</span>
                <button class="btn-danger" style="width:auto; padding: 4px 8px;" onclick="deleteCard(${idx})">刪除</button>
            `;
            deckListElem.appendChild(div);
        });
    }

    function deleteCard(index) {
        deck.splice(index, 1);
        saveDeck();
        startTest(true);
    }

    function clearDeck() {
        if (confirm('確定要清空所有單字庫嗎？此操作無法復原。')) {
            deck = [];
            saveDeck();
            document.getElementById('flashcardArea').style.display = 'none';
            document.getElementById('completeArea').style.display = 'none';
        }
    }

    // 初始化載入
    renderDeckList();
    startTest(true);
</script>
</body>
</html>
