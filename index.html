<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Vocabulary Reader & Learning Tool</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent-bg: #eff6ff;
            --accent-border: #bfdbfe;
            --active-row-bg: #e0e7ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 2rem;
            line-height: 1.5;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        header h1 {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
        }

        /* Control Panel */
        .control-panel {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 1.5rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.25rem;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        select, input[type="file"], textarea {
            padding: 0.6rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            background-color: #fff;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, textarea:focus {
            border-color: var(--primary-color);
        }

        /* Input & Upload Section */
        .input-section {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 2rem;
        }

        .input-section h3 {
            margin-bottom: 1rem;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        textarea {
            width: 100%;
            height: 110px;
            resize: vertical;
            font-family: monospace;
            margin-bottom: 1rem;
        }

        .btn-group {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button.secondary {
            background-color: #e2e8f0;
            color: #334155;
        }

        button.secondary:hover {
            background-color: #cbd5e1;
        }

        button.danger {
            background-color: #ef4444;
            color: white;
        }

        button.danger:hover {
            background-color: #dc2626;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Vocabulary Table Area */
        .table-container {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f1f5f9;
            font-weight: 600;
            color: #475569;
        }

        tr {
            transition: background-color 0.3s;
        }

        tr.reading-active {
            background-color: var(--active-row-bg) !important;
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* Interactive Word Click Zone */
        .word-interactive-zone {
            position: relative;
            display: inline-block;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
            background-color: var(--accent-bg);
            border: 1px dashed var(--accent-border);
            transition: all 0.2s ease;
        }

        .word-interactive-zone:hover {
            background-color: #dbeafe;
            border-color: var(--primary-color);
            transform: translateY(-1px);
        }

        .word-interactive-zone:active {
            transform: translateY(0);
            background-color: #bfdbfe;
        }

        .word-text {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--primary-color);
        }

        .usage-text {
            color: #334155;
            font-size: 0.95rem;
        }

        .hint-tag {
            font-size: 0.8rem;
            margin-left: 0.5rem;
        }

        @media (max-width: 640px) {
            body { padding: 1rem; }
            th, td { padding: 0.75rem; }
            .control-panel { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Interactive Vocabulary Reader</h1>
        <p>Upload or paste your vocabulary list. Click a word or use autoplay to practice pronunciation.</p>
        <p style="margin-top: 12px;">
            <a href="Flashcard.html" style="display: inline-block; padding: 6px 16px; background-color: #eff6ff; color: #4f46e5; border: 1px solid #bfdbfe; border-radius: 20px; font-weight: 600; text-decoration: none; font-size: 0.9rem;">
            Switch to Flashcard
            </a>
        </p>     
    </header>

    <!-- Control Panel -->
    <div class="control-panel">
        <div class="form-group">
            <label for="voiceSelect">🎙️ English Voice (TTS)</label>
            <select id="voiceSelect">
                <option value="">Loading voices...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="rateSelect">⚡ Reading Speed</label>
            <select id="rateSelect">
                <option value="0.5">0.5x (Slow)</option>
                <option value="0.75">0.75x (Slower)</option>
                <option value="1.0" selected>1.0x (Normal)</option>
                <option value="1.25">1.25x (Faster)</option>
                <option value="1.5">1.5x (Fast)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="fileInput">📁 Import File (.txt / .csv)</label>
            <input type="file" id="fileInput" accept=".txt, .csv">
        </div>

        <div class="form-group">
            <label>🔊 Sequential Playback</label>
            <div style="display: flex; gap: 0.5rem;">
                <button id="readAllBtn" style="flex: 1;">▶ Read All</button>
                <button id="stopBtn" class="danger" style="display: none;">⏹ Stop</button>
            </div>
        </div>
    </div>

    <!-- Input Section -->
    <div class="input-section">
        <h3>
            <span>📝 Edit / Paste Vocabulary Data</span>
            <span style="font-size: 0.85rem; font-weight: normal; color: var(--text-muted);">
                Format: Word | Chinese Meaning & Usage (or separated by comma/tab)
            </span>
        </h3>
        <textarea id="vocabInput" placeholder="e.g.
beleaguered | adj. 陷入困境的；句型：be beleaguered by problems
belligerent | adj. 好鬥的、挑釁的；搭配：a belligerent tone / attitude
beguile | v. 迷住、誘騙；句型：beguile someone into doing something
benevolent | adj. 仁慈的、善意的；搭配：a benevolent smile / gesture"></textarea>
        
        <div class="btn-group">
            <button id="renderBtn">Generate Table</button>
            <button id="loadSampleBtn" class="secondary">Load Default Sample</button>
        </div>
    </div>

    <!-- Vocabulary Table -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 35%;">Word & Audio (Click to Listen)</th>
                    <th style="width: 65%;">Meaning & Usage</th>
                </tr>
            </thead>
            <tbody id="vocabTableBody">
                <!-- Dynamically generated rows -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // Default Sample Data (No Phonetics)
    const defaultData = `beleaguered | adj. 陷入困境的；句型：be beleaguered by problems
belligerent | adj. 好鬥的、挑釁的；搭配：a belligerent tone / attitude
beguile | v. 迷住、誘騙；句型：beguile someone into doing something
benevolent | adj. 仁慈的、善意的；搭配：a benevolent smile / gesture
beneficiary | n. 受益人；搭配：insurance beneficiary (保險受益人)
bearing on | phr. 與…有關、對…有影響；句型：have a bearing on something`;

    let availableVoices = [];
    let activeWordsList = [];
    let isReadingAll = false;
    let currentReadingIndex = -1;

    // 1. Initialize TTS Voice Options
    function initVoices() {
        if (!('speechSynthesis' in window)) {
            alert('Your browser does not support Web Speech TTS API. Please use Chrome or Edge.');
            return;
        }

        availableVoices = window.speechSynthesis.getVoices();
        const voiceSelect = document.getElementById('voiceSelect');
        voiceSelect.innerHTML = '';

        const englishVoices = availableVoices.filter(voice => voice.lang.startsWith('en'));

        if (englishVoices.length === 0) {
            const opt = document.createElement('option');
            opt.textContent = 'No English voices found (Defaulting)';
            voiceSelect.appendChild(opt);
            return;
        }

        englishVoices.forEach(voice => {
            const option = document.createElement('option');
            option.value = voice.name;
            let region = voice.lang.toUpperCase();
            option.textContent = `${voice.name} (${region})`;
            
            if (voice.lang === 'en-US' || voice.lang === 'en_US') {
                option.selected = true;
            }
            voiceSelect.appendChild(option);
        });
    }

    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = initVoices;
    }

    // 2. Pronounce Single Word
    function speakWord(wordText, onEndCallback = null) {
        if (!('speechSynthesis' in window)) return;

        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(wordText);
        const selectedVoiceName = document.getElementById('voiceSelect').value;
        const selectedRate = parseFloat(document.getElementById('rateSelect').value) || 1.0;

        const chosenVoice = availableVoices.find(v => v.name === selectedVoiceName);
        if (chosenVoice) {
            utterance.voice = chosenVoice;
        }
        utterance.rate = selectedRate;

        if (onEndCallback) {
            utterance.onend = onEndCallback;
            utterance.onerror = onEndCallback;
        }

        window.speechSynthesis.speak(utterance);
    }

    // 3. Sequential Playback Feature (Read All)
    function stopSequentialReading() {
        isReadingAll = false;
        window.speechSynthesis.cancel();
        clearRowHighlights();
        document.getElementById('readAllBtn').style.display = 'inline-flex';
        document.getElementById('stopBtn').style.display = 'none';
    }

    function clearRowHighlights() {
        const rows = document.querySelectorAll('#vocabTableBody tr');
        rows.forEach(r => r.classList.remove('reading-active'));
    }

    function readNextInSequence() {
        if (!isReadingAll || currentReadingIndex >= activeWordsList.length) {
            stopSequentialReading();
            return;
        }

        clearRowHighlights();
        const rows = document.querySelectorAll('#vocabTableBody tr');
        if (rows[currentReadingIndex]) {
            rows[currentReadingIndex].classList.add('reading-active');
            // 移除了 scrollIntoView 滾動程式碼，讓頁面保持原本的位置
        }

        const wordToRead = activeWordsList[currentReadingIndex];

        speakWord(wordToRead, () => {
            if (!isReadingAll) return;
            currentReadingIndex++;
            const rate = parseFloat(document.getElementById('rateSelect').value) || 1.0;
            const delay = 600 / rate; 
            setTimeout(readNextInSequence, delay);
        });
    }

    function startSequentialReading() {
        if (activeWordsList.length === 0) return;
        
        isReadingAll = true;
        currentReadingIndex = 0;
        
        document.getElementById('readAllBtn').style.display = 'none';
        document.getElementById('stopBtn').style.display = 'inline-flex';

        readNextInSequence();
    }

    // 4. Parse & Render Table
    function renderTable(rawText) {
        stopSequentialReading();

        const tbody = document.getElementById('vocabTableBody');
        tbody.innerHTML = '';
        activeWordsList = [];

        const lines = rawText.split('\n').filter(line => line.trim() !== '');

        if (lines.length === 0) {
            tbody.innerHTML = '<tr><td colspan="2" style="text-align:center; color:#94a3b8;">No vocabulary data available</td></tr>';
            return;
        }

        lines.forEach(line => {
            let parts = [];
            if (line.includes('|')) {
                parts = line.split('|');
            } else if (line.includes('\t')) {
                parts = line.split('\t');
            } else {
                parts = line.split(',');
            }

            const word = parts[0] ? parts[0].trim() : '';
            const usage = parts.slice(1).join(' ').trim();

            if (!word) return;

            activeWordsList.push(word);

            const tr = document.createElement('tr');

            // Column 1: Interactive Word Box
            const tdWord = document.createElement('td');
            const interactiveZone = document.createElement('div');
            interactiveZone.className = 'word-interactive-zone';
            interactiveZone.title = 'Click to listen';
            
            interactiveZone.innerHTML = `
                <span class="word-text">${escapeHtml(word)}</span>
                <span class="hint-tag">🔊</span>
            `;

            interactiveZone.addEventListener('click', () => {
                stopSequentialReading();
                speakWord(word);
            });

            tdWord.appendChild(interactiveZone);

            // Column 2: Chinese Meaning & Usage
            const tdUsage = document.createElement('td');
            tdUsage.className = 'usage-text';
            tdUsage.innerHTML = escapeHtml(usage || 'No definition available');

            tr.appendChild(tdWord);
            tr.appendChild(tdUsage);
            tbody.appendChild(tr);
        });
    }

    // Security Helper: Escape HTML
    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;")
                  .replace(/</g, "&lt;")
                  .replace(/>/g, "&gt;")
                  .replace(/"/g, "&quot;")
                  .replace(/'/g, "&#039;");
    }

    // 5. Event Listeners
    document.getElementById('renderBtn').addEventListener('click', () => {
        const text = document.getElementById('vocabInput').value;
        renderTable(text);
    });

    document.getElementById('loadSampleBtn').addEventListener('click', () => {
        document.getElementById('vocabInput').value = defaultData;
        renderTable(defaultData);
    });

    document.getElementById('readAllBtn').addEventListener('click', startSequentialReading);
    document.getElementById('stopBtn').addEventListener('click', stopSequentialReading);

    // File Import (.txt / .csv)
    document.getElementById('fileInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            const content = event.target.result;
            document.getElementById('vocabInput').value = content;
            renderTable(content);
        };
        reader.readAsText(file, 'UTF-8');
    });

    // Page Load Initialization
    window.addEventListener('DOMContentLoaded', () => {
        initVoices();
        document.getElementById('vocabInput').value = defaultData;
        renderTable(defaultData);
    });
</script>

</body>
</html>
