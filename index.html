<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式英語單字朗讀與學習網頁</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent-bg: #eff6ff;
            --accent-border: #bfdbfe;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 2rem;
            line-height: 1.5;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        header h1 {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
        }

        /* 控制面板 */
        .control-panel {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 1.5rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.25rem;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        select, input[type="file"], textarea {
            padding: 0.6rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            background-color: #fff;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, textarea:focus {
            border-color: var(--primary-color);
        }

        /* 輸入與上傳區 */
        .input-section {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 2rem;
        }

        .input-section h3 {
            margin-bottom: 1rem;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        textarea {
            width: 100%;
            height: 100px;
            resize: vertical;
            font-family: monospace;
            margin-bottom: 1rem;
        }

        .btn-group {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button.secondary {
            background-color: #e2e8f0;
            color: #334155;
        }

        button.secondary:hover {
            background-color: #cbd5e1;
        }

        /* 單字表格區 */
        .table-container {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f1f5f9;
            font-weight: 600;
            color: #475569;
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* 可點擊點發音區塊 (透明浮層 / 點擊亮燈) */
        .word-interactive-zone {
            position: relative;
            display: inline-block;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
            background-color: var(--accent-bg);
            border: 1px dashed var(--accent-border);
            transition: all 0.2s ease;
        }

        .word-interactive-zone:hover {
            background-color: #dbeafe;
            border-color: var(--primary-color);
            transform: translateY(-1px);
        }

        .word-interactive-zone:active {
            transform: translateY(0);
            background-color: #bfdbfe;
        }

        .word-text {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--primary-color);
        }

        .word-phonetic {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-left: 0.5rem;
        }

        .usage-badge {
            display: inline-block;
            background-color: #f1f5f9;
            color: #334155;
            font-size: 0.85rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            margin-right: 0.5rem;
            font-weight: 600;
        }

        .usage-text {
            color: #334155;
            font-size: 0.95rem;
        }

        .hint-tag {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-left: 0.5rem;
        }

        @media (max-width: 640px) {
            body { padding: 1rem; }
            th, td { padding: 0.75rem; }
            .control-panel { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>互動式英語單字學習表</h1>
        <p>上傳或貼上單字表，點擊單字區塊即可發音朗讀</p>
           <p style="margin-top: 12px;">
            <a href="Flashcard.html" style="display: inline-block; padding: 6px 16px; background-color: #eff6ff; color: #4f46e5; border: 1px solid #bfdbfe; border-radius: 20px; font-weight: 600; text-decoration: none; font-size: 0.9rem;">
            </a>
        </p>     
    </header>

    <!-- 控制選單：口音與語速 -->
    <div class="control-panel">
        <div class="form-group">
            <label for="voiceSelect">🎙️ 英語口音選單 (TTS)</label>
            <select id="voiceSelect">
                <option value="">正在載入語音套件...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="rateSelect">⚡ 朗讀語速 (Speed)</label>
            <select id="rateSelect">
                <option value="0.5">0.5x (慢速)</option>
                <option value="0.75">0.75x (稍微慢)</option>
                <option value="1.0" selected>1.0x (正常速度)</option>
                <option value="1.25">1.25x (稍微快)</option>
                <option value="1.5">1.5x (快速)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="fileInput">📁 上傳單字表檔 (.txt / .csv)</label>
            <input type="file" id="fileInput" accept=".txt, .csv">
        </div>
    </div>

    <!-- 文字輸入與範例按鈕 -->
    <div class="input-section">
        <h3>
            <span>📝 編輯 / 貼上單字資料</span>
            <span style="font-size: 0.85rem; font-weight: normal; color: var(--text-muted);">
                格式：單字 | 音標 | 中文意思與常用法 (或用逗號/Tab分隔)
            </span>
        </h3>
        <textarea id="vocabInput" placeholder="例如：
beleagured | /bɪˈliː.ɡɚd/ | adj. 陷入困境的、飽受挫折的 (be beleaguered by)
belligerent | /bəˈlɪdʒ.ɚ.ənt/ | adj. 好鬥的、挑釁的 (belligerent attitude)
beguile | /bɪˈɡaɪl/ | v. 欺騙、迷住 (beguile someone into doing sth)
benevolent | /bəˈnev.əl.ənt/ | adj. 仁慈的、慈善的 (benevolent gesture)"></textarea>
        
        <div class="btn-group">
            <button id="renderBtn">生成單字表格</button>
            <button id="loadSampleBtn" class="secondary">載入預設單字範例</button>
        </div>
    </div>

    <!-- 單字顯示表格 -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 35%;">單字與發音 (點擊區)</th>
                    <th style="width: 65%;">重要使用方式與解釋</th>
                </tr>
            </thead>
            <tbody id="vocabTableBody">
                <!-- 動態生成的單字列表將放於此 -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // 預設資料
    const defaultData = `beleaguered | /bɪˈliː.ɡɚd/ | adj. 陷入困境的；句型：be beleaguered by problems
belligerent | /bəˈlɪdʒ.ɚ.ənt/ | adj. 好鬥的、挑釁的；搭配：a belligerent tone / attitude
beguile | /bɪˈɡaɪl/ | v. 迷住、誘騙；句型：beguile someone into doing something
benevolent | /bəˈnev.əl.ənt/ | adj. 仁慈的、善意的；搭配：a benevolent smile / gesture
beneficiary | /ˌben.əˈfɪʃ.er.i/ | n. 受益人；搭配：insurance beneficiary (保險受益人)
bearing on | /ˈbeə.rɪŋ ɑːn/ | phr. 與…有關、對…有影響；句型：have a bearing on something`;

    // 全局語音清單
    let availableVoices = [];

    // 1. 初始化語音 TTS 選單 (自動篩選英語系)
    function initVoices() {
        if (!('speechSynthesis' in window)) {
            alert('您的瀏覽器不支援 Web Speech TTS API，請更換 Chrome 或 Edge 瀏覽器。');
            return;
        }

        availableVoices = window.speechSynthesis.getVoices();
        const voiceSelect = document.getElementById('voiceSelect');
        voiceSelect.innerHTML = '';

        // 篩選英語語音 (en-US, en-GB, en-AU, en-IN 等)
        const englishVoices = availableVoices.filter(voice => voice.lang.startsWith('en'));

        if (englishVoices.length === 0) {
            const opt = document.createElement('option');
            opt.textContent = '未找到英語系統語音 (使用預設)';
            voiceSelect.appendChild(opt);
            return;
        }

        // 依國家與名稱排序
        englishVoices.forEach(voice => {
            const option = document.createElement('option');
            option.value = voice.name;
            // 標示地區標籤 (如 US, UK, AU, IN)
            let region = voice.lang.toUpperCase();
            option.textContent = `${voice.name} (${region})`;
            
            // 預設選擇美語 (US)
            if (voice.lang === 'en-US' || voice.lang === 'en_US') {
                option.selected = true;
            }
            voiceSelect.appendChild(option);
        });
    }

    // Chrome/Edge 非同步載入 Voice 的事件監聽
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = initVoices;
    }

    // 2. 朗讀功能
    function speakWord(wordText) {
        if (!('speechSynthesis' in window)) return;

        // 停止之前的朗讀
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(wordText);
        const selectedVoiceName = document.getElementById('voiceSelect').value;
        const selectedRate = parseFloat(document.getElementById('rateSelect').value) || 1.0;

        // 設定口音與語速
        const chosenVoice = availableVoices.find(v => v.name === selectedVoiceName);
        if (chosenVoice) {
            utterance.voice = chosenVoice;
        }
        utterance.rate = selectedRate;

        window.speechSynthesis.speak(utterance);
    }

    // 3. 解析與渲染表格
    function renderTable(rawText) {
        const tbody = document.getElementById('vocabTableBody');
        tbody.innerHTML = '';

        const lines = rawText.split('\n').filter(line => line.trim() !== '');

        if (lines.length === 0) {
            tbody.innerHTML = '<tr><td colspan="2" style="text-align:center; color:#94a3b8;">尚未輸入任何單字資料</td></tr>';
            return;
        }

        lines.forEach(line => {
            // 支援 '|', ',', '\t' 分隔符號
            let parts = [];
            if (line.includes('|')) {
                parts = line.split('|');
            } else if (line.includes('\t')) {
                parts = line.split('\t');
            } else {
                parts = line.split(',');
            }

            const word = parts[0] ? parts[0].trim() : '';
            const phonetic = parts[1] && parts[1].includes('/') ? parts[1].trim() : '';
            
            // 如果第二欄不是音標，就歸類為解釋
            let usage = '';
            if (phonetic) {
                usage = parts.slice(2).join(' ').trim();
            } else {
                usage = parts.slice(1).join(' ').trim();
            }

            if (!word) return;

            const tr = document.createElement('tr');

            // 欄位 1：點擊發音互動區 (可點擊透明/亮色 div)
            const tdWord = document.createElement('td');
            const interactiveZone = document.createElement('div');
            interactiveZone.className = 'word-interactive-zone';
            interactiveZone.title = '點擊發音 (TTS)';
            
            interactiveZone.innerHTML = `
                <span class="word-text">${escapeHtml(word)}</span>
                ${phonetic ? `<span class="word-phonetic">${escapeHtml(phonetic)}</span>` : ''}
                <span class="hint-tag">🔊</span>
            `;

            // 綁定點擊事件
            interactiveZone.addEventListener('click', () => {
                speakWord(word);
            });

            tdWord.appendChild(interactiveZone);

            // 欄位 2：重要使用方式/中文解釋
            const tdUsage = document.createElement('td');
            tdUsage.className = 'usage-text';
            tdUsage.innerHTML = escapeHtml(usage || '暫無註解/用法說明');

            tr.appendChild(tdWord);
            tr.appendChild(tdUsage);
            tbody.appendChild(tr);
        });
    }

    // 工具函式：防止 XSS
    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;")
                  .replace(/</g, "&lt;")
                  .replace(/>/g, "&gt;")
                  .replace(/"/g, "&quot;")
                  .replace(/'/g, "&#039;");
    }

    // 4. 事件綁定
    document.getElementById('renderBtn').addEventListener('click', () => {
        const text = document.getElementById('vocabInput').value;
        renderTable(text);
    });

    document.getElementById('loadSampleBtn').addEventListener('click', () => {
        document.getElementById('vocabInput').value = defaultData;
        renderTable(defaultData);
    });

    // 檔案上傳讀取 (.txt / .csv)
    document.getElementById('fileInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            const content = event.target.result;
            document.getElementById('vocabInput').value = content;
            renderTable(content);
        };
        reader.readAsText(file, 'UTF-8');
    });

    // 初始化載入
    window.addEventListener('DOMContentLoaded', () => {
        initVoices();
        document.getElementById('vocabInput').value = defaultData;
        renderTable(defaultData);
    });
</script>

</body>
</html>
